<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>paper jump</title>
    <meta
      name="description"
      content="A paper toss game up a narrow shaft. Sling a crumpled sheet into the bin above you, and the bin you land in becomes the bin you throw from."
    />

    <!--
      The link-preview card: public/card.png, 1200x630. The URL resolves
      against this page, like any link. No og:title/og:description: scrapers
      fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      The game teaches itself: there is no instructional text anywhere in this
      document, and spec/paper-jump.test.ts asserts that by allowlisting every
      string the page is permitted to ship. The opening move is taught by the
      attract loop drawn on the canvas, not by words.
    -->
    <canvas id="stage" tabindex="0"></canvas>

    <div class="hud">
      <div class="hud__lives" id="lives" aria-hidden="true">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>

      <div class="hud__score" id="score">0</div>

      <div class="hud__sig">
        <h1 class="hud__title">paper jump</h1>
        <nav aria-label="Primary">
          <a href="https://github.com/comp4020-agentic-coding-studio/comp4020-crit5-rangermix">source</a>
        </nav>
      </div>
    </div>

    <div class="end" id="end" role="status" hidden>
      <p class="end__line">level: <span id="end-level">1</span></p>
      <p class="end__line">score: <span id="end-score">0</span>/<span id="end-best">0</span></p>
      <p class="end__line">max combo: <span id="end-combo">0</span></p>
      <p class="end__line end__restart">click to restart</p>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
